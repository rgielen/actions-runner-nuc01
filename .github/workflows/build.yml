# Builds the two runner images, checks each, and on main pushes and signs them.
# One matrix leg per Dockerfile target:
#
#   base    ghcr.io/rgielen/actions-runner-nuc01          profile nuc01 (gVisor)
#   docker  ghcr.io/rgielen/actions-runner-nuc01-docker   profile nuc01-docker (Kata + dind)
#
# One workflow file for both keeps one cosign identity (build.yml@refs/heads/main).
#
# Runs on GitHub-hosted runners, never on the scale sets this image is for: a
# broken image must not be the thing that has to build its own replacement,
# and this repository is public, so its minutes cost nothing.
name: build

on:
  push:
    branches: [main]
  pull_request:
  # Monthly, for the Ubuntu security updates in the apt layer. The runner
  # version itself moves through Renovate, not through this schedule.
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      # One image failing its check must not hold back the other: the base image
      # carries the 30-day runner version clock for the gVisor profile.
      fail-fast: false
      # The description becomes the package page's text on GHCR, next to the README.
      # Both are public: they describe the image, not where it runs.
      matrix:
        include:
          - target: base
            image: ghcr.io/rgielen/actions-runner-nuc01
            description: GitHub Actions runner image, the upstream runner plus gcc, make and zstd
          - target: docker
            image: ghcr.io/rgielen/actions-runner-nuc01-docker
            description: GitHub Actions runner image with Oracle GraalVM in the tool cache
    env:
      IMAGE: ${{ matrix.image }}
    timeout-minutes: 20
    permissions:
      contents: read
      # Push to GHCR as this repository.
      packages: write
      # Keyless cosign: the signature is bound to this workflow's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is published under the runner version, and the only place
      # that version is written down is the FROM line.
      - name: Read the runner version from the Dockerfile
        id: version
        run: |
          version=$(sed -n 's|^FROM ghcr\.io/actions/actions-runner:\([0-9][0-9.]*\)@sha256:.*|\1|p' Dockerfile)
          if [ -z "$version" ]; then
            echo "::error file=Dockerfile::FROM line is not ghcr.io/actions/actions-runner:<version>@sha256:<digest>"
            exit 1
          fi
          echo "runner=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: local/actions-runner-nuc01:check
          # The monthly run exists for the Ubuntu security updates in the apt layer,
          # and a cached layer would carry last month's packages forward unchanged
          # (Copilot review of #3). On schedule the check build therefore imports no
          # cache; it still exports one, and the push below builds from that fresh
          # cache -- so what is pushed is still what was checked.
          no-cache: ${{ github.event_name == 'schedule' }}
          # One cache scope per target, or the two legs overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      - name: Check the image
        run: >-
          docker run --rm
          -e EXPECTED_RUNNER_VERSION=${{ steps.version.outputs.runner }}
          -e CHECK_TARGET=${{ matrix.target }}
          -v "$PWD/check-image.sh:/check-image.sh:ro"
          --entrypoint /check-image.sh
          local/actions-runner-nuc01:check

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build again, from the cache, so what is pushed is what was checked.
      # One tag only, the runner version: k3s-nuc pins tag AND digest, so a
      # monthly rebuild reaches it as a digest update of the same tag, and a
      # second, date-stamped tag would only give Renovate two version schemes
      # to confuse.
      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.runner }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.runner }}
            org.opencontainers.image.description=${{ matrix.description }}
          cache-from: type=gha,scope=${{ matrix.target }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      # Signs the digest, not the tag. Verify with (either image name)
      #   cosign verify ghcr.io/rgielen/actions-runner-nuc01@<digest> \
      #     --certificate-identity-regexp '^https://github.com/rgielen/actions-runner-nuc01/\.github/workflows/build\.yml@refs/heads/main$' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.runner }}
        run: |
          {
            echo "### ${IMAGE}:${VERSION}"
            echo
            echo '```'
            echo "${IMAGE}:${VERSION}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
